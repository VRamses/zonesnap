[package]
name = "zonesnap"
version = "0.3.1"
edition = "2021"
description = "Zonas de encaixe para janelas no Windows, configuraveis por JSON"

[dependencies]
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
